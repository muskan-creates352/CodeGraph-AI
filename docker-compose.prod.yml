version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - falkordb_prod_data:/var/lib/falkordb

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codegraph-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=codegraph
    depends_on:
      - falkordb

volumes:
  falkordb_prod_data:
